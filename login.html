
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>Sign In | CAPQ</title>
<style>
:root {
  --black:#101114;
  --charcoal:#292D33;
  --gold:#D6B45C;
  --green:#16A77A;
  --white:#F7F7F4;
  --muted:#A9ADB5;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px 16px;
}
.card {
  width:100%;
  max-width:460px;
  background:#1c1f24;
  border:1px solid #3d4147;
  border-radius:20px;
  padding:32px;
}
.brand {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  text-decoration:none;
  color:white;
}
.logo-icon {
  width:56px;
  height:56px;
  background:#08090b;
  border:1px solid #786434;
  border-radius:15px;
  display:grid;
  place-items:center;
}
.logo-icon span {
  color:var(--gold);
  font-size:42px;
  font-weight:900;
  line-height:1;
}
.logo-text {
  font-size:34px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-1px;
  line-height:1;
}
.logo-text span { color:var(--gold); }
.tagline {
  font-size:10px;
  letter-spacing:2px;
  color:var(--muted);
  margin-top:5px;
}
h1 {
  text-align:center;
  font-size:28px;
  margin:32px 0 8px;
}
.intro {
  color:var(--muted);
  text-align:center;
  font-size:14px;
  line-height:1.6;
  margin:0 0 28px;
}
label {
  display:block;
  margin:18px 0 8px;
  font-size:13px;
  font-weight:bold;
}
input {
  width:100%;
  background:#101114;
  border:1px solid #484c53;
  border-radius:9px;
  color:white;
  padding:14px;
  font-size:15px;
}
input:focus {
  outline:none;
  border-color:var(--gold);
}
.password-wrap { position:relative; }
.password-wrap input { padding-right:70px; }
.show-password {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  background:transparent;
  border:0;
  color:var(--gold);
  font-size:12px;
  cursor:pointer;
}
.forgot {
  display:block;
  text-align:right;
  color:var(--gold);
  font-size:13px;
  text-decoration:none;
  margin-top:12px;
}
.submit-btn {
  width:100%;
  background:var(--gold);
  color:#111;
  border:0;
  border-radius:10px;
  padding:15px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:25px;
}
.submit-btn:disabled {
  opacity:.6;
  cursor:not-allowed;
}
.message {
  min-height:18px;
  text-align:center;
  margin-top:15px;
  color:var(--gold);
  font-size:13px;
  line-height:1.5;
}
.message.error { color:#ff9999; }
.message.success { color:#8fe0a5; }
.footer {
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:24px;
}
.footer a, .back {
  color:var(--gold);
  text-decoration:none;
}
.back {
  display:block;
  text-align:center;
  margin-top:20px;
  color:var(--muted);
  font-size:12px;
}
@media(max-width:480px) {
  .card { padding:24px 19px; }
}
</style>
</head>
<body>
<main class="card">

<a href="index.html" class="brand">
  <div class="logo-icon"><span>C</span></div>
  <div>
    <div class="logo-text">CAP<span>Q</span></div>
    <div class="tagline">BUILT FOR BARBERS</div>
  </div>
</a>

<h1>Welcome Back</h1>
<p class="intro">
  Sign in to manage your customers,
  walk-ins, and daily queue.
</p>

<form id="loginForm">
  <label for="email">Email Address</label>
  <input id="email" type="email"
    autocomplete="email"
    placeholder="you@example.com" required>

  <label for="password">Password</label>
  <div class="password-wrap">
    <input id="password" type="password"
      autocomplete="current-password"
      placeholder="Enter your password" required>
    <button type="button" class="show-password"
      id="togglePassword">Show</button>
  </div>

  <a href="#" id="forgotLink" class="forgot">
    Forgot Password?
  </a>

  <button type="submit" class="submit-btn"
    id="submitBtn">Sign In</button>

  <div id="message" class="message"
    role="status" aria-live="polite"></div>
</form>

<div class="footer">
  Don't have an account?
  <a href="signup.html">Create Account</a>
</div>

<a href="index.html" class="back">
  Return to CAPQ Homepage
</a>

</main>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://nfazsevnpfmabsipkrrh.supabase.co",
  "sb_publishable_FtcxTtmcHvtyu3m2KJRjqA_3Nzkk2La"
);

const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

function showMessage(text, type = "") {
  message.textContent = text;
  message.className = "message " + type;
}

document.getElementById("togglePassword")
  .addEventListener("click", () => {
    const input = document.getElementById("password");
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    document.getElementById("togglePassword")
      .textContent = showing ? "Show" : "Hide";
  });

document.getElementById("loginForm")
  .addEventListener("submit", async event => {
    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();
    const password =
      document.getElementById("password").value;

    submitBtn.disabled = true;
    submitBtn.textContent = "Signing In...";
    showMessage("Checking your account...");

    try {
      const { data, error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;

      if (!data.session) {
        throw new Error("No login session was created.");
      }

      showMessage(
        "Login successful! Opening dashboard...",
        "success"
      );
      window.location.replace("dashboard.html");

    } catch (error) {
      showMessage(
        error.message || "Login failed.",
        "error"
      );
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";
    }
  });

document.getElementById("forgotLink")
  .addEventListener("click", async event => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    if (!email ||
        !document.getElementById("email").checkValidity()) {
      showMessage(
        "Enter your valid email address first.",
        "error"
      );
      document.getElementById("email").focus();
      return;
    }

    showMessage("Requesting password reset email...");

    try {
      const { error } =
        await supabase.auth.resetPasswordForEmail(email, {
          redirectTo:
            window.location.origin + "/reset-password.html"
        });

      if (error) throw error;

      showMessage(
        "If this account exists, a password reset email will arrive shortly. Check your spam folder too.",
        "success"
      );
    } catch (error) {
      showMessage(
        error.message || "Unable to request password reset.",
        "error"
      );
    }
  });
</script>
</body>
</html>
