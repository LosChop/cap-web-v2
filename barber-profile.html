
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">

<title>Barber Connect | CAPQ Pro</title>

<link rel="icon" type="image/svg+xml" href="assets/capq-mark.svg">

<style>
:root {
  --black:#101114;
  --panel:#1D2025;
  --panel-light:#292D33;
  --gold:#D6B45C;
  --green:#16A77A;
  --white:#F7F7F4;
  --muted:#A9ADB5;
  --border:#393D44;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}

a {
  color:inherit;
}

button {
  font:inherit;
}

.container {
  max-width:680px;
  margin:0 auto;
  padding:22px 16px 50px;
}

.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.brand-link {
  text-decoration:none;
}

.brand {
  color:var(--gold);
  font-size:27px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span {
  color:var(--white);
  font-size:16px;
  letter-spacing:0;
}

.subtitle {
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
}

.home {
  color:var(--gold);
  font-size:13px;
  font-weight:700;
  text-decoration:none;
}

.hero {
  position:relative;
  margin-bottom:90px;
}

.cover,
.cover-placeholder {
  width:100%;
  height:250px;
  border:1px solid #6C5A32;
  border-radius:20px;
}

.cover {
  display:block;
  object-fit:cover;
  background:var(--panel);
}

.cover-placeholder {
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#292D33,#101114);
  color:var(--gold);
  font-size:55px;
  font-weight:900;
}

.avatar,
.avatar-placeholder {
  position:absolute;
  width:150px;
  height:150px;
  left:50%;
  bottom:-75px;
  transform:translateX(-50%);
  border:5px solid var(--gold);
  border-radius:50%;
  background:var(--panel-light);
  box-shadow:0 8px 28px rgba(0,0,0,.55);
}

.avatar {
  object-fit:cover;
}

.avatar-placeholder {
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--gold);
  font-size:55px;
  font-weight:900;
}

.identity {
  text-align:center;
  margin-bottom:24px;
}

h1 {
  margin:0 0 8px;
  font-size:clamp(27px,6vw,38px);
  line-height:1.15;
}

.username {
  color:var(--gold);
  font-size:16px;
  font-weight:700;
  margin-bottom:18px;
}

.bio {
  color:#C9CBD0;
  font-size:15px;
  line-height:1.7;
  white-space:pre-wrap;
  max-width:530px;
  margin:0 auto;
}

.share-actions {
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin:25px 0 32px;
}

.share-button,
.directory-button {
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  padding:13px 18px;
  border-radius:11px;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
  text-decoration:none;
}

.share-button {
  border:1px solid var(--gold);
  background:var(--gold);
  color:#111;
}

.directory-button {
  border:1px solid var(--border);
  background:var(--panel-light);
  color:var(--white);
}

.share-message {
  min-height:18px;
  margin:0;
  color:var(--green);
  text-align:center;
  font-size:12px;
}

.links {
  display:grid;
  gap:13px;
  margin:30px 0 35px;
}

.link-card {
  display:flex;
  align-items:center;
  gap:15px;
  width:100%;
  min-height:76px;
  padding:13px 17px;
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--panel);
  color:var(--white);
  text-decoration:none;
  transition:border-color .2s,transform .2s;
}

.link-card:hover {
  border-color:var(--gold);
  transform:translateY(-2px);
}

.link-card.booksy {
  border-color:var(--gold);
  background:linear-gradient(135deg,#29251B,#1D2025);
}

.link-icon {
  width:48px;
  height:48px;
  flex:0 0 48px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  border-radius:12px;
  background:#111216;
}

.link-icon img {
  width:40px;
  height:40px;
  object-fit:contain;
  border-radius:9px;
}

.link-icon svg {
  width:34px;
  height:34px;
  display:block;
}

.link-title {
  flex:1;
  min-width:0;
  font-size:17px;
  font-weight:800;
}

.link-arrow {
  color:var(--muted);
  font-size:27px;
}

.section-title {
  font-size:23px;
  font-weight:900;
  margin:0 0 17px;
}

.portfolio {
  margin-top:35px;
}

.gallery {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.gallery-button {
  padding:0;
  border:1px solid #4A4E55;
  border-radius:13px;
  overflow:hidden;
  background:var(--panel);
  cursor:pointer;
}

.gallery-button img {
  display:block;
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  transition:transform .2s;
}

.gallery-button:hover img {
  transform:scale(1.035);
}

.status {
  padding:65px 15px;
  text-align:center;
  color:var(--muted);
  line-height:1.6;
}

.hidden {
  display:none !important;
}

footer {
  margin-top:50px;
  padding:25px 0;
  border-top:1px solid var(--border);
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

footer strong {
  color:var(--gold);
}

.lightbox {
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:55px 16px;
  background:rgba(0,0,0,.94);
}

.lightbox img {
  max-width:100%;
  max-height:85vh;
  object-fit:contain;
  border-radius:10px;
}

.close-lightbox {
  position:absolute;
  top:15px;
  right:18px;
  border:0;
  background:transparent;
  color:white;
  font-size:38px;
  cursor:pointer;
}

:focus-visible {
  outline:3px solid var(--gold);
  outline-offset:3px;
}

@media(max-width:400px) {
  .cover,
  .cover-placeholder {
    height:210px;
  }

  .avatar,
  .avatar-placeholder {
    width:132px;
    height:132px;
    bottom:-66px;
  }

  .hero {
    margin-bottom:82px;
  }

  .link-card {
    min-height:69px;
  }

  .link-title {
    font-size:15px;
  }
}
</style>
</head>

<body>

<main class="container">

<header class="topbar">
  <a href="index.html" class="brand-link">
    <div class="brand">
      CAPQ <span>PRO</span>
    </div>
    <div class="subtitle">BARBER CONNECT</div>
  </a>

  <a class="home" href="barbers.html">
    All Barbers
  </a>
</header>

<div id="status" class="status">
  Loading barber profile...
</div>

<div id="profile" class="hidden">

  <section class="hero">
    <div id="coverArea"></div>
    <div id="avatarArea"></div>
  </section>

  <section class="identity">
    <h1 id="displayName"></h1>
    <div id="username" class="username"></div>
    <div id="bio" class="bio"></div>
  </section>

  <div class="share-actions">
    <button
      id="copyProfileButton"
      class="share-button"
      type="button"
    >
      Copy Profile Link
    </button>

    <a
      href="barbers.html"
      class="directory-button"
    >
      Back to Barbers
    </a>
  </div>

  <p
    id="shareMessage"
    class="share-message"
    role="status"
    aria-live="polite"
  ></p>

  <section id="linksSection" class="links"></section>

  <section
    id="portfolioSection"
    class="portfolio hidden"
  >
    <h2 class="section-title">My Work</h2>
    <div id="gallery" class="gallery"></div>
  </section>

  <footer>
    Powered by <strong>CAPQ PRO</strong>
    <div style="margin-top:6px">
      BARBER CONNECT
    </div>
  </footer>

</div>
</main>

<div
  id="lightbox"
  class="lightbox hidden"
  role="dialog"
  aria-modal="true"
  aria-label="Portfolio photo viewer"
>
  <button
    id="closeLightbox"
    class="close-lightbox"
    type="button"
    aria-label="Close photo"
  >&times;</button>

  <img
    id="lightboxImage"
    alt="Portfolio photo enlarged"
  >
</div>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
  "https://nfazsevnpfmabsipkrrh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_FtcxTtmcHvtyu3m2KJRjqA_3Nzkk2La";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

const ICONS = {
  booksy: `
    <img
      src="assets/booksy-logo.png"
      alt=""
      width="40"
      height="40"
    >
  `,

  instagram: `
    <svg viewBox="0 0 64 64"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true">
      <defs>
        <linearGradient id="igGradient"
          x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#FEDA75"/>
          <stop offset="35%" stop-color="#FA7E1E"/>
          <stop offset="65%" stop-color="#D62976"/>
          <stop offset="100%" stop-color="#4F5BD5"/>
        </linearGradient>
      </defs>
      <rect x="3" y="3" width="58" height="58"
        rx="15" fill="url(#igGradient)"/>
      <rect x="15" y="15" width="34" height="34"
        rx="11" fill="none"
        stroke="white" stroke-width="5"/>
      <circle cx="32" cy="32" r="9"
        fill="none" stroke="white"
        stroke-width="5"/>
      <circle cx="46" cy="18" r="3.5"
        fill="white"/>
    </svg>
  `,

  tiktok: `
    <svg viewBox="0 0 64 64"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true">
      <rect width="64" height="64"
        rx="13" fill="#080808"/>
      <path d="M37 11v28a10 10 0 1 1-10-10"
        fill="none" stroke="#25F4EE"
        stroke-width="8"
        stroke-linecap="round"
        transform="translate(-3 2)"/>
      <path d="M37 11c2 10 7 14 16 15M37 11v28
        a10 10 0 1 1-10-10"
        fill="none" stroke="#FE2C55"
        stroke-width="8"
        stroke-linecap="round"
        transform="translate(2 -1)"/>
      <path d="M37 11c2 10 7 14 16 15M37 11v28
        a10 10 0 1 1-10-10"
        fill="none" stroke="white"
        stroke-width="6"
        stroke-linecap="round"/>
    </svg>
  `,

  youtube: `
    <svg viewBox="0 0 64 64"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true">
      <rect x="3" y="13" width="58" height="38"
        rx="12" fill="#FF0033"/>
      <path d="M27 22L45 32L27 42Z"
        fill="white"/>
    </svg>
  `,

  website: `
    <svg viewBox="0 0 64 64"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true">
      <path d="M26 38l12-12M23 29l-6 6
        a11 11 0 0 0 16 16l6-6
        M41 35l6-6a11 11 0 0 0-16-16
        l-6 6"
        fill="none"
        stroke="#D6B45C"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>
  `
};

function showError(text) {
  $("status").textContent = text;
  $("status").classList.remove("hidden");
  $("profile").classList.add("hidden");
}

function validUrl(value) {
  if (!value || typeof value !== "string") {
    return null;
  }

  try {
    const url = new URL(value.trim());

    return url.protocol === "https:"
      ? url.href
      : null;
  } catch {
    return null;
  }
}

function socialUrl(value, platform) {
  if (!value) return null;

  const text = String(value).trim();
  if (!text) return null;

  const fullUrl = validUrl(text);
  if (fullUrl) return fullUrl;

  const username = text.replace(/^@/, "");

  if (!/^[a-zA-Z0-9._-]+$/.test(username)) {
    return null;
  }

  const encoded = encodeURIComponent(username);

  if (platform === "instagram") {
    return "https://www.instagram.com/" +
      encoded + "/";
  }

  if (platform === "tiktok") {
    return "https://www.tiktok.com/@" +
      encoded;
  }

  if (platform === "youtube") {
    return "https://www.youtube.com/@" +
      encoded;
  }

  return null;
}

function addLink(label, value, iconName, special = false) {
  const url = validUrl(value);
  if (!url) return;

  const link = document.createElement("a");

  link.className = "link-card" +
    (special ? " booksy" : "");

  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.setAttribute("aria-label", label);

  const icon = document.createElement("div");
  icon.className = "link-icon";
  icon.innerHTML =
    ICONS[iconName] || ICONS.website;

  const title = document.createElement("span");
  title.className = "link-title";
  title.textContent = label;

  const arrow = document.createElement("span");
  arrow.className = "link-arrow";
  arrow.setAttribute("aria-hidden", "true");
  arrow.textContent = "›";

  link.append(icon,title,arrow);

  $("linksSection").appendChild(link);
}

function renderCover(data) {
  const coverUrl = validUrl(data.cover_url);

  const avatarUrl =
    validUrl(data.avatar_url) || coverUrl;

  if (coverUrl) {
    const cover = document.createElement("img");
    cover.className = "cover";
    cover.src = coverUrl;
    cover.alt =
      (data.display_name || "Barber") +
      " cover photo";

    $("coverArea").appendChild(cover);
  } else {
    const cover = document.createElement("div");
    cover.className = "cover-placeholder";
    cover.textContent = "CAPQ";

    $("coverArea").appendChild(cover);
  }

  if (avatarUrl) {
    const avatar = document.createElement("img");
    avatar.className = "avatar";
    avatar.src = avatarUrl;
    avatar.alt =
      (data.display_name || "Barber") +
      " profile photo";

    $("avatarArea").appendChild(avatar);
  } else {
    const avatar = document.createElement("div");
    avatar.className = "avatar-placeholder";

    avatar.textContent =
      (data.display_name || "C")
        .trim()
        .charAt(0)
        .toUpperCase();

    $("avatarArea").appendChild(avatar);
  }
}

function renderGallery(data) {
  const photos = Array.isArray(data.gallery_urls)
    ? data.gallery_urls.slice(0,6)
    : [];

  photos.forEach((photo,index) => {
    const url = validUrl(photo);
    if (!url) return;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "gallery-button";

    button.setAttribute(
      "aria-label",
      "View portfolio photo " + (index + 1)
    );

    const img = document.createElement("img");
    img.src = url;
    img.alt =
      "Barber portfolio photo " + (index + 1);
    img.loading = "lazy";

    button.appendChild(img);

    button.addEventListener("click", () => {
      $("lightboxImage").src = url;
      $("lightbox").classList.remove("hidden");
      $("closeLightbox").focus();
    });

    $("gallery").appendChild(button);

    $("portfolioSection").classList.remove("hidden");
  });
}

function renderProfile(data) {
  document.title =
    (data.display_name || "Barber") +
    " | CAPQ Pro";

  $("displayName").textContent =
    data.display_name || "Professional Barber";

  $("username").textContent =
    data.slug ? "@" + data.slug : "";

  $("bio").textContent =
    data.bio || "Professional barber.";

  $("coverArea").replaceChildren();
  $("avatarArea").replaceChildren();
  $("linksSection").replaceChildren();
  $("gallery").replaceChildren();

  $("portfolioSection").classList.add("hidden");

  renderCover(data);

  addLink(
    "Book on Booksy",
    data.booksy_url,
    "booksy",
    true
  );

  addLink(
    "Instagram",
    socialUrl(data.instagram_url,"instagram"),
    "instagram"
  );

  addLink(
    "TikTok",
    socialUrl(data.tiktok_url,"tiktok"),
    "tiktok"
  );

  addLink(
    "YouTube",
    socialUrl(data.youtube_url,"youtube"),
    "youtube"
  );

  addLink(
    "Website / Contact",
    data.contact_url,
    "website"
  );

  renderGallery(data);

  $("status").classList.add("hidden");
  $("profile").classList.remove("hidden");
}

async function loadProfile() {
  const params = new URLSearchParams(
    window.location.search
  );

  const slug = (
    params.get("barber") || ""
  ).trim().toLowerCase();

  const barberId = (
    params.get("id") || ""
  ).trim();

  const fields =
    "display_name,slug,bio,cover_url," +
    "booksy_url,instagram_url,tiktok_url," +
    "youtube_url,contact_url,gallery_urls";

  let query = supabase
    .from("barber_connect_profiles")
    .select(fields);

  if (/^[a-z0-9-]{3,40}$/.test(slug)) {
    query = query.eq("slug",slug);
  } else if (
    /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
      .test(barberId)
  ) {
    query = query.eq("id",barberId);
  } else {
    showError(
      "Barber profile not selected. " +
      "Open a barber's shared profile link."
    );
    return;
  }

  const { data,error } = await query.maybeSingle();

  if (error) {
    console.error("Profile load error:",error);
    showError("Unable to load this barber profile.");
    return;
  }

  if (!data) {
    showError(
      "This barber profile is not available yet."
    );
    return;
  }

  // Optional avatar_url is fetched separately so
  // existing tables without this column still work.
  let profileData = { ...data };

  if (data.slug) {
    const avatarResult = await supabase
      .from("barber_connect_profiles")
      .select("avatar_url")
      .eq("slug",data.slug)
      .maybeSingle();

    if (!avatarResult.error && avatarResult.data) {
      profileData.avatar_url =
        avatarResult.data.avatar_url;
    }
  }

  renderProfile(profileData);
}

async function copyProfileLink() {
  const params = new URLSearchParams(
    window.location.search
  );

  const slug = (
    params.get("barber") || ""
  ).trim().toLowerCase();

  const url = new URL(
    "barber-profile.html",
    window.location.href
  );

  url.search = "";

  if (slug) {
    url.searchParams.set("barber",slug);
  } else {
    const id = params.get("id");

    if (id) {
      url.searchParams.set("id",id);
    }
  }

  try {
    await navigator.clipboard.writeText(url.href);

    $("shareMessage").textContent =
      "Profile link copied!";
  } catch {
    $("shareMessage").textContent =
      "Copy this link: " + url.href;
  }
}

function closeLightbox() {
  $("lightbox").classList.add("hidden");
  $("lightboxImage").removeAttribute("src");
}

$("copyProfileButton").addEventListener(
  "click",
  copyProfileLink
);

$("closeLightbox").addEventListener(
  "click",
  closeLightbox
);

$("lightbox").addEventListener("click",event => {
  if (event.target === $("lightbox")) {
    closeLightbox();
  }
});

document.addEventListener("keydown",event => {
  if (event.key === "Escape") {
    closeLightbox();
  }
});

await loadProfile();
</script>

</body>
</html>
