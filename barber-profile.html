
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barber Connect | CAPQ Pro</title>
  <meta name="description" content="View a barber's portfolio, social media, and booking information on CAPQ Pro.">
  <style>
    :root {
      --bg: #101114;
      --panel: #292d33;
      --gold: #d6b45c;
      --white: #f7f7f4;
      --muted: #aeb2b8;
      --green: #16a77a;
      --border: #444850;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; }
    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      color: var(--gold);
      font-size: 23px;
      font-weight: 800;
      text-decoration: none;
    }
    .header-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }
    main {
      max-width: 920px;
      margin: 24px auto 70px;
      padding: 0 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .cover {
      height: 245px;
      background: linear-gradient(135deg, #363020, #141619);
      background-position: center;
      background-size: cover;
    }
    .profile-content {
      padding: 22px;
    }
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 4px solid var(--panel);
      object-fit: cover;
      background: #17191d;
      margin-top: -78px;
      display: block;
    }
    .avatar-fallback {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 4px solid var(--panel);
      background: #17191d;
      margin-top: -78px;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 38px;
      font-weight: bold;
    }
    h1 {
      margin: 14px 0 4px;
      font-size: 30px;
    }
    h2 {
      color: var(--gold);
      font-size: 19px;
      margin: 0 0 14px;
    }
    .muted { color: var(--muted); }
    .bio {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 15px 0;
    }
    .actions, .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border-radius: 10px;
      padding: 12px 18px;
      background: var(--gold);
      color: #101114;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--gold);
      cursor: pointer;
      font: inherit;
    }
    .button.secondary {
      background: #17191d;
      color: var(--gold);
    }
    .button:focus-visible, a:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: 3px;
    }
    .section-body { padding: 22px; }
    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 14px;
      border-radius: 10px;
      background: #17191d;
      border: 1px solid var(--border);
      text-decoration: none;
      font-size: 14px;
    }
    .social-link svg {
      width: 23px;
      height: 23px;
      flex: none;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .gallery a {
      display: block;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #17191d;
    }
    .gallery img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .2s;
    }
    .gallery a:hover img { transform: scale(1.04); }
    .status {
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .status.error { color: #ffb5b5; }
    [hidden] { display: none !important; }
    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 600px) {
      .cover { height: 180px; }
      .profile-content, .section-body { padding: 16px; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      h1 { font-size: 25px; }
    }
  </style>
</head>
<body>

<header>
  <a class="brand" href="index.html">CAPQ PRO</a>
  <a class="header-link" href="barbers.html">Find a Barber</a>
</header>

<main>
  <div id="status" class="status" role="status">
    Loading Barber Connect profile...
  </div>

  <div id="profile" hidden>
    <section class="panel">
      <div id="cover" class="cover"></div>
      <div class="profile-content">
        <img id="avatar" class="avatar" alt="Barber profile photo" hidden>
        <div id="avatarFallback" class="avatar-fallback" hidden></div>

        <h1 id="displayName"></h1>
        <div class="muted">Barber Connect • CAPQ Pro</div>
        <p id="bio" class="bio" hidden></p>

        <div class="actions">
          <a id="booksyLink" class="button" target="_blank"
             rel="noopener noreferrer" hidden>
            Book Appointment
          </a>
          <a id="contactLink" class="button secondary" target="_blank"
             rel="noopener noreferrer" hidden>
            Contact
          </a>
          <button id="shareButton" class="button secondary" type="button">
            Share Profile
          </button>
        </div>
      </div>
    </section>

    <section id="socialSection" class="panel" hidden>
      <div class="section-body">
        <h2>Connect With Me</h2>
        <div id="socialLinks" class="socials"></div>
      </div>
    </section>

    <section id="gallerySection" class="panel" hidden>
      <div class="section-body">
        <h2>My Haircut Portfolio</h2>
        <div id="gallery" class="gallery"></div>
      </div>
    </section>
  </div>
</main>

<footer>Powered by CAPQ Pro • Barber Connect</footer>

<script type="module">
  import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const supabase = createClient(
    "https://nfazsevnpfmabsipkrrh.supabase.co",
    "sb_publishable_FtcxTtmcHvtyu3m2KJRjqA_3Nzkk2La"
  );

  const $ = id => document.getElementById(id);

  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug")?.trim().toLowerCase();

  const icons = {
    instagram: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" aria-hidden="true">
      <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
      <circle cx="12" cy="12" r="4.2"/>
      <circle cx="17.6" cy="6.5" r="1" fill="currentColor" stroke="none"/>
    </svg>`,
    tiktok: `<svg viewBox="0 0 24 24" fill="currentColor"
      aria-hidden="true">
      <path d="M16.7 2c.3 2.5 1.7 4 4.3 4.2v3.5a9.2 9.2 0 0 1-4.3-1.2v7.1
      a7 7 0 1 1-7-7c.4 0 .9 0 1.3.1v3.7a3.5 3.5 0 1 0 2.1 3.2V2h3.6Z"/>
    </svg>`,
    youtube: `<svg viewBox="0 0 24 24" fill="currentColor"
      aria-hidden="true">
      <path d="M21.5 7.2a2.7 2.7 0 0 0-1.9-1.9C17.9 4.8 12 4.8 12 4.8s-5.9
      0-7.6.5a2.7 2.7 0 0 0-1.9 1.9A28 28 0 0 0 2 12a28 28 0 0 0
      .5 4.8 2.7 2.7 0 0 0 1.9 1.9c1.7.5 7.6.5 7.6.5s5.9 0 7.6-.5a2.7
      2.7 0 0 0 1.9-1.9A28 28 0 0 0 22 12a28 28 0 0 0-.5-4.8ZM10
      15.5v-7l6 3.5-6 3.5Z"/>
    </svg>`
  };

  function safeHttps(value) {
    if (typeof value !== "string" || !value.trim()) return null;
    try {
      const url = new URL(value.trim());
      return url.protocol === "https:" ? url.href : null;
    } catch {
      return null;
    }
  }

  function showError(message) {
    $("status").textContent = message;
    $("status").classList.add("error");
    $("status").hidden = false;
    $("profile").hidden = true;
  }

  function setExternalLink(id, value) {
    const url = safeHttps(value);
    const link = $(id);
    if (url) {
      link.href = url;
      link.hidden = false;
    } else {
      link.hidden = true;
      link.removeAttribute("href");
    }
  }

  function addSocial(label, value, iconName) {
    const url = safeHttps(value);
    if (!url) return;

    const link = document.createElement("a");
    link.className = "social-link";
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.setAttribute("aria-label", label);
    link.innerHTML = icons[iconName];

    const name = document.createElement("span");
    name.textContent = label;
    link.appendChild(name);

    $("socialLinks").appendChild(link);
  }

  function renderProfile(data) {
    $("displayName").textContent = data.display_name || "Barber";
    document.title = (data.display_name || "Barber") + " | CAPQ Pro";

    const bio = typeof data.bio === "string" ? data.bio.trim() : "";
    $("bio").textContent = bio;
    $("bio").hidden = !bio;

    const cover = safeHttps(data.cover_url);
    if (cover) {
      $("cover").style.backgroundImage =
        `linear-gradient(0deg,rgba(0,0,0,.2),rgba(0,0,0,.1)),url("${cover.replace(/["\\]/g, "")}")`;
    }

    const avatar = safeHttps(data.avatar_url);
    if (avatar) {
      $("avatar").src = avatar;
      $("avatar").hidden = false;
      $("avatarFallback").hidden = true;
      $("avatar").onerror = () => {
        $("avatar").hidden = true;
        $("avatarFallback").hidden = false;
      };
    } else {
      $("avatar").hidden = true;
      $("avatarFallback").hidden = false;
    }

    $("avatarFallback").textContent =
      (data.display_name || "B").trim().charAt(0).toUpperCase();

    setExternalLink("booksyLink", data.booksy_url);
    setExternalLink("contactLink", data.contact_url);

    $("socialLinks").replaceChildren();
    addSocial("Instagram", data.instagram_url, "instagram");
    addSocial("TikTok", data.tiktok_url, "tiktok");
    addSocial("YouTube", data.youtube_url, "youtube");

    $("socialSection").hidden = !$("socialLinks").children.length;

    $("gallery").replaceChildren();
    const photos = Array.isArray(data.gallery_urls)
      ? data.gallery_urls
      : [];

    for (const value of photos) {
      const url = safeHttps(value);
      if (!url) continue;

      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", "Open haircut portfolio photo");

      const img = document.createElement("img");
      img.src = url;
      img.alt = "Haircut portfolio photo";
      img.loading = "lazy";

      link.appendChild(img);
      $("gallery").appendChild(link);
    }

    $("gallerySection").hidden = !$("gallery").children.length;

    $("status").hidden = true;
    $("profile").hidden = false;
  }

  $("shareButton").addEventListener("click", async () => {
    const url = window.location.href;

    try {
      if (navigator.share) {
        await navigator.share({
          title: document.title,
          url
        });
      } else if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(url);
        $("shareButton").textContent = "Link Copied!";
        setTimeout(() => {
          $("shareButton").textContent = "Share Profile";
        }, 2000);
      } else {
        window.prompt("Copy your profile link:", url);
      }
    } catch (error) {
      if (error.name !== "AbortError") {
        window.prompt("Copy your profile link:", url);
      }
    }
  });

  async function loadProfile() {
    if (!slug || !/^[a-z0-9-]+$/.test(slug)) {
      showError("No valid barber profile name was provided.");
      return;
    }

    try {
      const { data, error } = await supabase
        .from("barber_connect_profiles")
        .select(
          "display_name,bio,slug,avatar_url,cover_url,booksy_url," +
          "contact_url,instagram_url,tiktok_url,youtube_url,gallery_urls"
        )
        .eq("slug", slug)
        .maybeSingle();

      if (error) throw error;

      if (!data) {
        showError("This Barber Connect profile is not available.");
        return;
      }

      renderProfile(data);
    } catch (error) {
      console.error(error);
      showError("Unable to load this Barber Connect profile right now.");
    }
  }

  loadProfile();
</script>
</body>
</html>
