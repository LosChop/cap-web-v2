
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>CAPQ | Barber Management</title>
<style>
:root {
  --black:#101114;
  --charcoal:#292D33;
  --gold:#D6B45C;
  --green:#16A77A;
  --white:#F7F7F4;
  --muted:#A9ADB5;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.5;
}
main {
  max-width:700px;
  margin:auto;
  padding:25px 18px 60px;
}
header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding-bottom:20px;
  border-bottom:1px solid #35383d;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:white;
}
.logo-icon {
  width:54px;
  height:54px;
  background:#08090b;
  border:1px solid #786434;
  border-radius:15px;
  display:grid;
  place-items:center;
}
.logo-icon span {
  font-size:40px;
  font-weight:900;
  color:var(--gold);
}
.logo-text {
  font-size:29px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-1px;
  line-height:1;
}
.logo-text span { color:var(--gold); }
.subtitle {
  color:var(--muted);
  font-size:9px;
  letter-spacing:2px;
  margin-top:5px;
}
.badge {
  color:var(--gold);
  border:1px solid #6c5a32;
  border-radius:20px;
  padding:6px 11px;
  font-size:11px;
}
h1 {
  font-size:32px;
  margin:30px 0 5px;
}
.description {
  color:var(--muted);
  font-size:14px;
  margin:0 0 25px;
}
.panel {
  background:#1c1f24;
  border:1px solid #383c42;
  border-radius:15px;
  padding:20px;
  margin:18px 0;
}
h2 { font-size:21px; margin:0 0 15px; }
label {
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}
input {
  width:100%;
  background:#101114;
  border:1px solid #484c53;
  border-radius:9px;
  color:white;
  padding:14px;
  font-size:15px;
}
input:focus {
  outline:none;
  border-color:var(--gold);
}
button {
  border:0;
  border-radius:9px;
  padding:12px 16px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled { opacity:.6; cursor:wait; }
.add-btn {
  width:100%;
  margin-top:14px;
  background:var(--gold);
  color:#111;
}
.barber {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 0;
  border-bottom:1px solid #383c42;
}
.barber:last-child { border-bottom:0; }
.barber-name { font-weight:bold; font-size:16px; }
.barber-detail {
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
}
.remove-btn {
  color:#ff9999;
  background:#3b2528;
  border:1px solid #694044;
}
.message {
  color:var(--gold);
  font-size:13px;
  min-height:20px;
  margin:12px 0;
}
.empty {
  color:var(--muted);
  text-align:center;
  padding:25px 10px;
  font-size:14px;
}
.nav {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:30px;
}
.nav a {
  text-align:center;
  text-decoration:none;
  background:var(--charcoal);
  border:1px solid #44484e;
  color:white;
  padding:13px 8px;
  border-radius:9px;
  font-size:13px;
}
.note {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:25px;
}
@media(max-width:480px) {
  .logo-icon { width:46px;height:46px; }
  .logo-icon span { font-size:35px; }
  .logo-text { font-size:25px; }
  .panel { padding:16px; }
}
</style>
</head>
<body>
<main>
<header>
  <a href="index.html" class="brand">
    <div class="logo-icon"><span>C</span></div>
    <div>
      <div class="logo-text">CAP<span>Q</span></div>
      <div class="subtitle">BUILT FOR BARBERS</div>
    </div>
  </a>
  <span class="badge">SHOP OWNER</span>
</header>

<h1>Barber Management</h1>
<p class="description" id="shopName">
  Connecting to your shop...
</p>

<section class="panel">
  <h2>Add Barber</h2>
  <form id="addForm">
    <label for="barberName">Barber Name</label>
    <input id="barberName"
      placeholder="Enter barber's name"
      maxlength="80" required>
    <button class="add-btn" id="addBtn"
      type="submit">Add Barber</button>
  </form>
</section>

<section class="panel">
  <h2>Your Barbers</h2>
  <div id="message" class="message" role="status">
    Checking owner access...
  </div>
  <div id="barberList"></div>
</section>

<nav class="nav">
  <a href="dashboard.html">Dashboard</a>
  <a href="checkin.html">Check-In</a>
  <a href="index.html">Home</a>
</nav>

<p class="note">
  Owner-only barber management test.
  Adding a barber does not create an employee login.
</p>
</main>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://nfazsevnpfmabsipkrrh.supabase.co",
  "sb_publishable_FtcxTtmcHvtyu3m2KJRjqA_3Nzkk2La"
);

const SHOP_ID =
  "061c8b27-0d31-404a-b227-2839639acb35";

const list = document.getElementById("barberList");
const message = document.getElementById("message");
const addBtn = document.getElementById("addBtn");
const addForm = document.getElementById("addForm");

let authorized = false;

function showMessage(text) {
  message.textContent = text;
}

function showEmpty(text) {
  list.replaceChildren();
  const div = document.createElement("div");
  div.className = "empty";
  div.textContent = text;
  list.appendChild(div);
}

async function verifyOwner() {
  const { data: { user }, error: authError } =
    await supabase.auth.getUser();

  if (authError || !user) {
    window.location.replace("login.html");
    return false;
  }

  const { data: shop, error } = await supabase
    .from("barber_shops")
    .select("id,name")
    .eq("id", SHOP_ID)
    .eq("owner_id", user.id)
    .maybeSingle();

  if (error || !shop) {
    showMessage(
      error
        ? "Access error: " + error.message
        : "You are not the owner of this shop."
    );
    showEmpty("Shop access unavailable.");
    return false;
  }

  document.getElementById("shopName").textContent =
    shop.name + " · Manage your team";

  return true;
}

async function loadBarbers() {
  if (!authorized) return;

  showMessage("Loading barbers...");

  const { data, error } = await supabase
    .from("barbers")
    .select("id,name,created_at")
    .eq("shop_id", SHOP_ID)
    .order("created_at", { ascending:true });

  if (error) {
    showMessage("Error: " + error.message);
    return;
  }

  list.replaceChildren();

  if (!data.length) {
    showEmpty("No barbers added yet.");
    showMessage("");
    return;
  }

  for (const barber of data) {
    const row = document.createElement("div");
    row.className = "barber";

    const details = document.createElement("div");

    const name = document.createElement("div");
    name.className = "barber-name";
    name.textContent = barber.name;

    const sub = document.createElement("div");
    sub.className = "barber-detail";
    sub.textContent = "Registered barber";

    details.append(name, sub);

    const remove = document.createElement("button");
    remove.className = "remove-btn";
    remove.textContent = "Remove";

    remove.addEventListener("click", async () => {
      if (!confirm(
        "Remove " + barber.name + " from this shop?"
      )) return;

      remove.disabled = true;
      showMessage("Removing barber...");

      const { error } = await supabase
        .from("barbers")
        .delete()
        .eq("id", barber.id)
        .eq("shop_id", SHOP_ID);

      if (error) {
        showMessage("Could not remove: " + error.message);
        remove.disabled = false;
        return;
      }

      await loadBarbers();
    });

    row.append(details, remove);
    list.appendChild(row);
  }

  showMessage("");
}

addForm.addEventListener("submit", async event => {
  event.preventDefault();
  if (!authorized) return;

  const input = document.getElementById("barberName");
  const name = input.value.trim();

  if (!name) return;

  addBtn.disabled = true;
  showMessage("Adding barber...");

  const { error } = await supabase
    .from("barbers")
    .insert({
      shop_id: SHOP_ID,
      name
    });

  if (error) {
    showMessage("Could not add barber: " + error.message);
  } else {
    input.value = "";
    await loadBarbers();
  }

  addBtn.disabled = false;
});

addForm.querySelectorAll("input,button").forEach(el => {
  el.disabled = true;
});

if (await verifyOwner()) {
  authorized = true;
  addForm.querySelectorAll("input,button").forEach(el => {
    el.disabled = false;
  });
  await loadBarbers();
}
</script>
</body>
</html>
