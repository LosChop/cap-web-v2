
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>CAPQ | Walk-In Check-In</title>

<style>
:root {
  --black:#101114;
  --charcoal:#292D33;
  --gold:#D6B45C;
  --green:#16A77A;
  --ivory:#F7F7F4;
  --muted:#A9ADB5;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--black);
  color:var(--ivory);
  font-family:Arial,Helvetica,sans-serif;
}
main {
  max-width:480px;
  margin:auto;
  padding:25px 20px 60px;
}
header {
  text-align:center;
  margin-bottom:30px;
}
.logo {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
}
.logo-icon {
  width:58px;
  height:58px;
  border:1px solid #6b592e;
  border-radius:15px;
  background:#08090b;
  display:grid;
  place-items:center;
}
.logo-icon span {
  color:var(--gold);
  font-size:44px;
  font-weight:900;
}
.logo-text {
  font-size:40px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-2px;
}
.logo-text span { color:var(--gold); }
.tag {
  color:var(--gold);
  letter-spacing:3px;
  font-size:10px;
  margin-top:8px;
}
h1 {
  text-align:center;
  font-size:26px;
  margin:35px 0 8px;
}
p {
  color:var(--muted);
  text-align:center;
  line-height:1.5;
}
label {
  display:block;
  margin:18px 0 8px;
  font-weight:bold;
  font-size:14px;
}
input,select {
  width:100%;
  padding:15px;
  border-radius:9px;
  border:1px solid #555;
  background:#202227;
  color:white;
  font-size:16px;
}
input:focus,select:focus {
  outline:2px solid var(--gold);
  outline-offset:2px;
}
button {
  width:100%;
  background:var(--gold);
  color:#111;
  padding:17px;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  margin-top:25px;
  cursor:pointer;
}
button:disabled {
  opacity:.6;
  cursor:wait;
}
.message {
  text-align:center;
  margin-top:18px;
  font-weight:bold;
  font-size:14px;
  line-height:1.5;
  color:var(--green);
}
.message.error { color:#ff9999; }
.back {
  display:block;
  text-align:center;
  color:var(--gold);
  font-size:13px;
  text-decoration:none;
  margin-top:35px;
}
.note {
  margin-top:25px;
  font-size:12px;
  color:var(--muted);
}
.shop-name {
  text-align:center;
  color:var(--gold);
  font-size:13px;
  margin-top:10px;
}
</style>
</head>

<body>
<main>

<header>
  <div class="logo">
    <div class="logo-icon"><span>C</span></div>
    <div class="logo-text">CAP<span>Q</span></div>
  </div>
  <div class="tag">BUILT FOR BARBERS</div>
</header>

<h1>Walk-In Check-In</h1>
<p>Add a walk-in customer to your shop's live queue.</p>

<div id="shopName" class="shop-name">
  Checking shop access...
</div>

<form id="checkin" hidden>

  <label for="name">Customer Name</label>
  <input
    id="name"
    type="text"
    required
    maxlength="60"
    autocomplete="off"
    placeholder="Enter customer name"
  >

  <label for="service">Select Service</label>
  <select id="service" required>
    <option value="Haircut">Haircut</option>
    <option value="Haircut + Beard">Haircut + Beard</option>
    <option value="Kids Haircut">Kids Haircut</option>
    <option value="Beard Trim">Beard Trim</option>
  </select>

  <label for="preference">Barber Preference</label>
  <select id="preference">
    <option value="Next Available">
      Next Available Barber
    </option>
  </select>

  <button id="submitBtn" type="submit">
    Join Waitlist
  </button>

</form>

<div id="message" class="message" role="status"
     aria-live="polite"></div>

<p class="note">
  CAPQ Live Test: Owner-assisted check-in only.
  Public QR check-in and SMS verification are not
  enabled yet.
</p>

<a class="back" href="dashboard.html">
  View Live Dashboard
</a>

<a class="back" href="index.html">
  Back to CAPQ Home
</a>

</main>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://nfazsevnpfmabsipkrrh.supabase.co",
  "sb_publishable_FtcxTtmcHvtyu3m2KJRjqA_3Nzkk2La"
);

const SHOP_ID =
  "061c8b27-0d31-404a-b227-2839639acb35";

const form = document.getElementById("checkin");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");
const shopName = document.getElementById("shopName");

let authorized = false;

function showMessage(text, error = false) {
  message.textContent = text;
  message.className = error
    ? "message error"
    : "message";
}

async function verifyOwner() {
  try {
    const {
      data: { user },
      error: authError
    } = await supabase.auth.getUser();

    if (authError || !user) {
      shopName.textContent = "Owner login required";
      showMessage(
        "Please sign in to add customers.",
        true
      );
      return;
    }

    const { data: shop, error } = await supabase
      .from("barber_shops")
      .select("id,name")
      .eq("id", SHOP_ID)
      .eq("owner_id", user.id)
      .maybeSingle();

    if (error) throw error;

    if (!shop) {
      shopName.textContent = "Access unavailable";
      showMessage(
        "This account is not the owner of the test shop.",
        true
      );
      return;
    }

    authorized = true;
    shopName.textContent = shop.name;
    form.hidden = false;

  } catch (error) {
    shopName.textContent = "Connection error";
    showMessage(
      "Unable to verify shop: " + error.message,
      true
    );
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (!authorized) return;

  const name =
    document.getElementById("name").value.trim();

  const service =
    document.getElementById("service").value;

  const preference =
    document.getElementById("preference").value;

  if (!name || name.length > 60) {
    showMessage("Enter a valid customer name.", true);
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Adding Customer...";
  showMessage("Saving customer to CAPQ...");

  try {
    const { data, error } = await supabase
      .from("capq_queue")
      .insert({
        customer_name: name,
        service: service,
        barber_preference: preference,
        status: "Waiting",
        shop_id: SHOP_ID
      })
      .select("id,customer_name")
      .single();

    if (error) throw error;

    showMessage(
      data.customer_name +
      ", you're successfully added to the live queue!"
    );

    form.reset();

  } catch (error) {
    showMessage(
      "Check-in failed: " + error.message,
      true
    );
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Join Waitlist";
  }
});

await verifyOwner();
</script>

</body>
</html>
