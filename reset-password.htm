
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | CAPQ</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:#101114;
  color:#F7F7F4;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card {
  width:100%;
  max-width:440px;
  background:#1c1f24;
  border:1px solid #3d4147;
  border-radius:20px;
  padding:30px;
}
.brand {
  text-align:center;
  font-size:34px;
  font-weight:900;
  font-style:italic;
}
.brand span { color:#D6B45C; }
.tagline {
  text-align:center;
  font-size:10px;
  letter-spacing:2px;
  color:#A9ADB5;
}
h1 { text-align:center; font-size:26px; }
p {
  color:#A9ADB5;
  text-align:center;
  font-size:14px;
  line-height:1.6;
}
label {
  display:block;
  margin:18px 0 8px;
  font-size:13px;
  font-weight:bold;
}
input {
  width:100%;
  padding:14px;
  background:#101114;
  border:1px solid #484c53;
  border-radius:9px;
  color:white;
  font-size:15px;
}
button {
  width:100%;
  margin-top:24px;
  background:#D6B45C;
  color:#111;
  border:0;
  border-radius:10px;
  padding:15px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled { opacity:.6; }
#message {
  text-align:center;
  font-size:13px;
  margin-top:18px;
  line-height:1.5;
  color:#D6B45C;
}
a {
  color:#D6B45C;
  display:block;
  text-align:center;
  margin-top:24px;
  text-decoration:none;
  font-size:13px;
}
</style>
</head>
<body>
<main class="card">
  <div class="brand">CAP<span>Q</span></div>
  <div class="tagline">BUILT FOR BARBERS</div>

  <h1>Create New Password</h1>
  <p>Enter a new password for your CAPQ account.</p>

  <form id="resetForm">
    <label for="password">New Password</label>
    <input id="password" type="password"
      autocomplete="new-password"
      minlength="12" required>

    <label for="confirm">Confirm Password</label>
    <input id="confirm" type="password"
      autocomplete="new-password"
      minlength="12" required>

    <button id="saveBtn" type="submit">
      Update Password
    </button>
  </form>

  <div id="message" role="status"></div>
  <a href="login.html">Return to Sign In</a>
</main>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://nfazsevnpfmabsipkrrh.supabase.co",
  "sb_publishable_FtcxTtmcHvtyu3m2KJRjqA_3Nzkk2La",
  {
    auth: {
      detectSessionInUrl: true
    }
  }
);

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const button = document.getElementById("saveBtn");

let recoveryReady = false;
let processing = false;

form.hidden = true;
message.textContent = "Verifying your reset link...";

async function prepareRecovery() {
  const params = new URLSearchParams(window.location.search);
  const hashParams = new URLSearchParams(
    window.location.hash.substring(1)
  );

  if (params.has("error") || hashParams.has("error")) {
    throw new Error(
      params.get("error_description") ||
      hashParams.get("error_description") ||
      "This reset link is invalid or expired."
    );
  }

  if (params.get("token_hash") &&
      params.get("type") === "recovery") {
    const { error } = await supabase.auth.verifyOtp({
      token_hash: params.get("token_hash"),
      type: "recovery"
    });
    if (error) throw error;
    recoveryReady = true;
  } else if (params.get("code")) {
    const { error } = await supabase.auth.exchangeCodeForSession(
      params.get("code")
    );
    if (error) throw error;
    recoveryReady = true;
  } else if (hashParams.get("access_token") &&
             hashParams.get("refresh_token") &&
             hashParams.get("type") === "recovery") {
    const { error } = await supabase.auth.setSession({
      access_token: hashParams.get("access_token"),
      refresh_token: hashParams.get("refresh_token")
    });
    if (error) throw error;
    recoveryReady = true;
  } else {
    throw new Error(
      "Open this page using the password reset link in your email."
    );
  }

  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );

  form.hidden = false;
  message.textContent = "Reset link verified. Enter your new password.";
}

try {
  await prepareRecovery();
} catch (error) {
  message.textContent = error.message;
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (!recoveryReady || processing) return;

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (password !== confirm) {
    message.textContent = "Passwords do not match.";
    return;
  }

  if (password.length < 12) {
    message.textContent = "Use at least 12 characters.";
    return;
  }

  processing = true;
  button.disabled = true;
  button.textContent = "Updating...";
  message.textContent = "Saving your new password...";

  try {
    const { error } = await supabase.auth.updateUser({
      password
    });

    if (error) throw error;

    await supabase.auth.signOut();

    form.hidden = true;
    message.textContent =
      "Password updated successfully! Return to Sign In.";
  } catch (error) {
    message.textContent = error.message || "Reset failed.";
    button.disabled = false;
    button.textContent = "Update Password";
    processing = false;
  }
});
</script>
</body>
</html>
