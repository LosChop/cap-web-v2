
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="CAPQ - Smarter walk-in management for barbers and barbershops.">
  <title>CAPQ | Built for Barbers</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    h1 {
      font-size: clamp(75px, 17vw, 150px);
      letter-spacing: 5px;
      margin: 0;
      font-weight: 800;
    }

    h2 {
      color: #D4AF50;
      font-size: clamp(24px, 5vw, 36px);
      margin: 25px 0;
    }

    p {
      color: #BBBBBB;
      font-size: clamp(18px, 3vw, 23px);
      line-height: 1.6;
      max-width: 600px;
      margin: 25px auto 45px;
    }

    .button {
      display: inline-block;
      background: #D4AF50;
      color: #101010;
      padding: 20px 45px;
      border-radius: 12px;
      font-size: 22px;
      font-weight: bold;
    }

    footer {
      color: #777;
      font-size: 13px;
      margin-top: 70px;
    }
  </style>
</head>
<body>
  <main>
    <h1>CAPQ</h1>
    <h2>Built for Barbers</h2>

    <p>
      Smarter walk-in management for
      barbers and barbershops.
    </p>

    <div class="button">Coming Soon</div>

    <footer>
      &copy; 2026 CAPQ. All rights reserved.
    </footer>
  </main>
</body>
</html>
